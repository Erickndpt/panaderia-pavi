name: panaderia-pavi-dev

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: panaderia-oracle
    restart: unless-stopped
    ports:
      - "1531:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-123456}
      APP_USER: PANADERIA_APP
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-123456}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./panaderia-backend/database/init:/container-entrypoint-initdb.d:ro
      - ./panaderia-backend/database:/scripts:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s

  keycloak-db:
    image: postgres:17-alpine
    container_name: panaderia-keycloak-db
    restart: unless-stopped
    ports:
      - "35432:5432"
    environment:
      POSTGRES_DB: panaderia_keycloak
      POSTGRES_USER: panaderia_keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-123456}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panaderia_keycloak -d panaderia_keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: panaderia-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "38080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/panaderia_keycloak
      KC_DB_USERNAME: panaderia_keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-123456}
      KC_HOSTNAME: http://localhost:38080
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./panaderia-backend/keycloak/import:/opt/keycloak/data/import:ro
      - ./panaderia-backend/keycloak/themes/panaderia:/opt/keycloak/themes/panaderia:ro

  backend:
    build:
      context: ./panaderia-backend
      dockerfile: Dockerfile.dev
    container_name: panaderia-backend
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USERNAME: PANADERIA_APP
      DB_PASSWORD: ${APP_USER_PASSWORD:-123456}
      KEYCLOAK_ISSUER: http://localhost:38080/realms/panaderia
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/panaderia/protocol/openid-connect/certs
      PERU_API_KEY: ${PERU_API_KEY:-}
    volumes:
      - ./panaderia-backend/src:/workspace/src
      - maven-cache:/root/.m2

  frontend:
    build:
      context: ./panaderia-frontend
      dockerfile: Dockerfile.dev
    container_name: panaderia-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "4200:4200"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./panaderia-frontend/src:/workspace/src
      - ./panaderia-frontend/public:/workspace/public

volumes:
  oracle-data:
    name: ${ORACLE_VOLUME_NAME:-panaderia-backend-dev_oracle-data}
  keycloak-data:
    name: ${KEYCLOAK_VOLUME_NAME:-panaderia-backend-dev_keycloak-data}
  keycloak-db-data:
    name: ${KEYCLOAK_DB_VOLUME_NAME:-panaderia-backend-dev_keycloak-db-data}
  maven-cache:
    name: ${MAVEN_CACHE_VOLUME_NAME:-panaderia-pavi-dev_maven-cache}
