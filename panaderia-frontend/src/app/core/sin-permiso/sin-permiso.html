<section class="sin-permiso">
  <mat-icon class="sin-permiso__icono" aria-hidden="true">lock</mat-icon>
  <h2 class="sin-permiso__titulo">No tienes permiso para acceder</h2>
  <p class="sin-permiso__mensaje">
    Tu sesión está activa, pero el rol asignado no permite abrir esta sección. Si crees que es un
    error, contacta al administrador del sistema.
  </p>
  <a mat-flat-button color="primary" routerLink="/">
    <mat-icon>home</mat-icon>
    Volver al inicio
  </a>
</section>
