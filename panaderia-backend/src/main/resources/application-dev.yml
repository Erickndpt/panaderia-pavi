server:
  port: 8081

spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1531/FREEPDB1
    username: PANADERIA_APP
    password: "123456"
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:38080/realms/panaderia

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    permit-all: false

logging:
  level:
    pe.edu.upeu.panaderia: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always