server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@oracle:1521/FREEPDB1}
    username: ${DB_USERNAME:PANADERIA_APP}
    password: ${DB_PASSWORD:123456}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:38080/realms/panaderia}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/panaderia/protocol/openid-connect/certs}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    permit-all: false

logging:
  level:
    pe.edu.upeu.panaderia: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
