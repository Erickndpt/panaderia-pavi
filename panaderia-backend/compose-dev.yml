name: panaderia-backend-dev

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: panaderia-oracle
    restart: unless-stopped
    ports:
      - "1531:1521"
    environment:
      ORACLE_PASSWORD: "123456"
      APP_USER: PANADERIA_APP
      APP_USER_PASSWORD: "123456"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  keycloak-db:
    image: postgres:17-alpine
    container_name: panaderia-keycloak-db
    restart: unless-stopped
    ports:
      - "35432:5432"
    environment:
      POSTGRES_DB: panaderia_keycloak
      POSTGRES_USER: panaderia_keycloak
      POSTGRES_PASSWORD: "123456"
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panaderia_keycloak -d panaderia_keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: panaderia-keycloak
    restart: unless-stopped
    command: start-dev
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "38080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/panaderia_keycloak
      KC_DB_USERNAME: panaderia_keycloak
      KC_DB_PASSWORD: "123456"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/themes/panaderia:/opt/keycloak/themes/panaderia:ro

volumes:
  oracle-data:
  keycloak-data:
  keycloak-db-data:
